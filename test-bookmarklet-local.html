<!DOCTYPE html>
<html>

<head>
    <title>YTDL4U Bookmarklet Tester</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            padding: 40px;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            margin-top: 0;
            color: #667eea;
            font-size: 24px;
        }

        p {
            color: #94a3b8;
            line-height: 1.6;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #8f9bff;
            font-family: monospace;
            padding: 10px;
            margin: 15px 0;
            box-sizing: border-box;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #64748b;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Local Bookmarklet Tester</h1>
        <p>This "Mock YouTube" page helps you verify the bookmarklet code locally before using it on the real site.</p>

        <script>
            // Setup mock cookies
            document.cookie = "VISITOR_INFO1_LIVE=LOCAL_MOCK_VALUE; path=/";
            document.cookie = "LOGIN_INFO=LOCAL_AUTH_MOCK; path=/";
        </script>

        <p><strong>Step 1:</strong> Paste the bookmarklet code here:</p>
        <textarea id="code" placeholder="javascript:(...)"></textarea>

        <button onclick="runTest()">Test Extractor Logic</button>

        <p class="footer">Clicking the button will simulate a bookmarklet click on this page.</p>

        <script>
            function runTest() {
                const rawCode = document.getElementById('code').value.trim();
                if (!rawCode.startsWith('javascript:')) {
                    alert('Please paste the complete code (must start with javascript:)');
                    return;
                }

                // For local testing, we bypass the youtube.com check
                let jsCode = rawCode.substring(11);
                jsCode = jsCode.replace("location.hostname.includes('youtube.com')", "true");

                try {
                    eval(jsCode);
                } catch (e) {
                    alert('Error: ' + e.message);
                    console.error(e);
                }
            }
        </script>
    </div>
</body>

</html>
